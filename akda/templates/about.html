{% extends "base.html" %}
{% block title %}About - {{ APP_NAME }}{% endblock %}
{% block content %}
  <div class="reading-column">
    <h1 class="listing-title">About</h1>
    {% if about_html %}
      <div class="article-body">{{ about_html|safe }}</div>
    {% else %}
      <p class="page-intro">This page hasn't been written yet.</p>
    {% endif %}
    {% if can.can_edit_about(g.user) %}
      <p class="about-edit"><a class="button button-quiet" href="{{ url_for('auth.settings') }}">Edit the About page</a></p>
    {% endif %}
  </div>
{% endblock %}
